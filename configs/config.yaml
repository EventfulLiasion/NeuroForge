project: neuroforge
seed: 42

paths:
  data_dir: data
  rag_corpus: data/rag_corpus.jsonl
  faiss_index: data/faiss.index
  bm25_index: data/bm25.pkl
  ml_model: data/churn_model.pkl
  ml_metrics: data/ml_metrics.json

rag:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 512
  chunk_overlap: 80
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 6
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  use_reranker: true

ml:
  test_size: 0.2
  n_trials_optuna: 20
  models: [logreg, random_forest, hist_gb]

llm:
  # priority order. First available key wins. None => offline extractive mode.
  provider_order: [groq, gemini, openai_compatible, offline]
  groq_model: llama-3.1-8b-instant
  gemini_model: gemini-1.5-flash
  max_tokens: 512
  temperature: 0.2

api:
  host: 0.0.0.0
  port: 8000
